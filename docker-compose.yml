services:
  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_business_operations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ai_business_operations
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ai_business_operations

    ports:
      - "8000:8000"

    volumes:
      - ./knowledge_base:/app/knowledge_base

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "python create_tables.py &&
      uvicorn main:app --host 0.0.0.0 --port 8000"


volumes:
  postgres_data: